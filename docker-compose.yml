# CanaryChain - isolation baseline (Ayush)
# Each tenant sits alone on an internal network. The ONLY path between
# tenants is the gateway. Tenants have no internet and no host access.

x-hardening: &hardening
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  user: "10001:10001"
  pids_limit: 128
  mem_limit: 512m
  cpus: 0.5
  security_opt:
    - no-new-privileges:true
  # Docker's DEFAULT seccomp profile applies automatically. Tighten later
  # (seccomp/tenant.json) only after everything works, and re-run tests/isolation_check.sh.

networks:
  red_net:  { internal: true }
  blue_net: { internal: true }
  llm_net:  { internal: true }
  mgmt:     {}            # non-internal: only the gateway sits here so the host can reach it
  app_net:  { internal: true }
  gateway_api: { internal: true }

volumes:
  red_data:
  blue_data:
  llm_data:
  core_data:

services:
  red:
    <<: *hardening
    build: ./tenants
    environment: { TENANT_NAME: red }
    networks: [red_net]
    volumes: [red_data:/data]
    healthcheck: &hc
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  blue:
    <<: *hardening
    build: ./tenants
    environment: { TENANT_NAME: blue }
    networks: [blue_net]
    volumes: [blue_data:/data]
    healthcheck: *hc

  llm:
    <<: *hardening
    build: ./tenants
    environment: { TENANT_NAME: llm }
    networks: [llm_net]
    volumes: [llm_data:/data]
    healthcheck: *hc

  gateway:
    <<: *hardening
    build: ./gateway
    networks: [red_net, blue_net, llm_net, mgmt, gateway_api]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [red, blue, llm]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;s=socket.create_connection(('127.0.0.1',8080),2);s.close()"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Later: environment: { COLLECTOR_URL: http://collector:9000/events }

  core-api:
    build:
      context: .
      dockerfile: app/Dockerfile
    read_only: true
    tmpfs: [/tmp]
    user: "10001:10001"
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    environment:
      CORE_DATABASE_PATH: /data/core.sqlite3
      GATEWAY_BASE_URL: http://gateway:8080
    volumes:
      - core_data:/data
    networks: [app_net, gateway_api]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build: ./frontend
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    user: "101:101"
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    ports: ["127.0.0.1:8081:8080"]
    networks: [app_net]
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
