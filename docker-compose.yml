# CanaryChain - isolation baseline (Ayush)
# Each tenant sits alone on an internal network. The ONLY path between
# tenants is the gateway. Tenants have no internet and no host access.

# Pin the project name: demo/breakit.sh refers to the canarychain_* network names.
name: canarychain

x-hardening: &hardening
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  user: "10001:10001"
  pids_limit: 128
  mem_limit: 512m
  cpus: 0.5
  security_opt:
    - no-new-privileges:true
  # Docker's DEFAULT seccomp profile applies automatically. Tighten later
  # (seccomp/tenant.json) only after everything works, and re-run tests/isolation_check.sh.

networks:
  red_net:  { internal: true }
  blue_net: { internal: true }
  llm_net:  { internal: true }
  mgmt:     {}            # non-internal: only the gateway sits here so the host can reach it
  app_net:  { internal: true }
  gateway_api: { internal: true }

volumes:
  red_data:
  blue_data:
  llm_data:
  core_data:

services:
  red:
    <<: *hardening
    build: ./tenants
    environment: { TENANT_NAME: red }
    networks: [red_net]
    volumes: [red_data:/data]
    healthcheck: &hc
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  blue:
    <<: *hardening
    build: ./tenants
    environment: { TENANT_NAME: blue }
    networks: [blue_net]
    volumes: [blue_data:/data]
    healthcheck: *hc

  llm:
    <<: *hardening
    build: ./tenants
    environment: { TENANT_NAME: llm }
    networks: [llm_net]
    volumes: [llm_data:/data]
    healthcheck: *hc

  gateway:
    <<: *hardening
    build: ./gateway
    networks: [red_net, blue_net, llm_net, mgmt, gateway_api]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [red, blue, llm]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;s=socket.create_connection(('127.0.0.1',8080),2);s.close()"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      COLLECTOR_URL: http://core-api:8000/internal/event
      INTERNAL_EVENT_TOKEN: ${INTERNAL_EVENT_TOKEN:?set INTERNAL_EVENT_TOKEN in .env}

  core-api:
    build:
      context: .
      dockerfile: app/Dockerfile
    read_only: true
    tmpfs: [/tmp]
    user: "10001:10001"
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    environment:
      CORE_DATABASE_PATH: /data/core.sqlite3
      GATEWAY_BASE_URL: http://gateway:8080
      SECURITY_DATABASE_PATH: /data/security.sqlite3
      INTERNAL_EVENT_TOKEN: ${INTERNAL_EVENT_TOKEN:?set INTERNAL_EVENT_TOKEN in .env}
    volumes:
      - core_data:/data
    networks: [app_net, gateway_api]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build: ./frontend
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    user: "101:101"
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    ports: ["127.0.0.1:8081:8080"]
    networks: [app_net]
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3

  canary-red:
    <<: *hardening
    build: { context: ., dockerfile: infra/containers/canary/Dockerfile }
    command: ["network"]
    environment:
      CANARY_VICTIM: red-team
      INTERNAL_EVENT_URL: http://core-api:8000/internal/event
      INTERNAL_EVENT_TOKEN: ${INTERNAL_EVENT_TOKEN:?set INTERNAL_EVENT_TOKEN in .env}
    networks: [red_net, gateway_api]
    depends_on:
      core-api: { condition: service_healthy }

  canary-blue:
    <<: *hardening
    build: { context: ., dockerfile: infra/containers/canary/Dockerfile }
    command: ["network"]
    environment:
      CANARY_VICTIM: blue-team
      INTERNAL_EVENT_URL: http://core-api:8000/internal/event
      INTERNAL_EVENT_TOKEN: ${INTERNAL_EVENT_TOKEN:?set INTERNAL_EVENT_TOKEN in .env}
    networks: [blue_net, gateway_api]
    depends_on:
      core-api: { condition: service_healthy }

  canary-llm:
    <<: *hardening
    build: { context: ., dockerfile: infra/containers/canary/Dockerfile }
    command: ["network"]
    environment:
      CANARY_VICTIM: client-llm
      INTERNAL_EVENT_URL: http://core-api:8000/internal/event
      INTERNAL_EVENT_TOKEN: ${INTERNAL_EVENT_TOKEN:?set INTERNAL_EVENT_TOKEN in .env}
    networks: [llm_net, gateway_api]
    depends_on:
      core-api: { condition: service_healthy }

  canary-host:                      # file watcher + process probe. Holds the Docker socket: keep off tenant networks.
    <<: *hardening
    build: { context: ., dockerfile: infra/containers/canary/Dockerfile }
    command: ["host"]
    group_add: ["${DOCKER_GID:?set DOCKER_GID in .env (getent group docker | cut -d: -f3)}"]
    environment:
      INTERNAL_EVENT_URL: http://core-api:8000/internal/event
      INTERNAL_EVENT_TOKEN: ${INTERNAL_EVENT_TOKEN:?set INTERNAL_EVENT_TOKEN in .env}
      CANARY_VOLUMES: red-team=/vols/red,blue-team=/vols/blue,client-llm=/vols/llm
    volumes:
      - red_data:/vols/red:ro
      - blue_data:/vols/blue:ro
      - llm_data:/vols/llm:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [gateway_api]
    depends_on:                     # decoys are planted before a tenant turns healthy; arming earlier would trip on planting
      red: { condition: service_healthy }
      blue: { condition: service_healthy }
      llm: { condition: service_healthy }
      core-api: { condition: service_healthy }
